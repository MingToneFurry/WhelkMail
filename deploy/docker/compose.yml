name: whelkmail

services:
  whelkmail:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: whelkmail:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/whelkmail.sqlite
    ports:
      - "8787:8787"
    volumes:
      - whelkmail-data:/data
    # Add MinIO with: docker compose --profile s3 up -d --build
    # then set the S3_* variables in .env (endpoint http://minio:9000).

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-whelkmail}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-please}
    volumes:
      - whelkmail-minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  whelkmail-data:
  whelkmail-minio:
