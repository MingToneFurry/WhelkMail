name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A personal deployment config must never reach the public repository:
      # it carries the Pages URL and account-scoped resource identifiers. The
      # list mirrors the patterns in .gitignore, minus the published templates.
      - name: No personal config
        run: |
          tracked=$(git ls-files -- 'wrangler.toml' 'worker/wrangler.toml' '.dev.vars' '.dev.vars.*' '.env' '.env.*' | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "These files must stay untracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The frontend build says nothing about the Node bundle produced by
      # esbuild for the Docker entry point.
      - name: Build every target
        run: npm run build:all

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f deploy/docker/Dockerfile -t whelkmail:local .

      - name: Start the container with the example env
        run: |
          cd deploy/docker
          cp .env.example .env
          sed -i 's|^APP_PASSWORD=.*|APP_PASSWORD=ci-password-only|' .env
          sed -i "s|^TOKEN_ENC_KEY=.*|TOKEN_ENC_KEY=$(openssl rand -base64 32)|" .env
          sed -i 's|^PUBLIC_ORIGIN=.*|PUBLIC_ORIGIN=http://127.0.0.1:8787|' .env
          docker compose up -d --no-build whelkmail
          # The healthcheck is what the image declares; wait for it instead of
          # sleeping blindly.
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q whelkmail)")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker compose logs whelkmail
          exit 1
